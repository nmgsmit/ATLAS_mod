defaults:
  - _self_
  - model: base

# workspace configuration
workspace_root: ./workspace

# Where "Open..." looks for source videos. raw_videos_root is the project's own folder;
# extra_video_roots are searched as well, so recordings that live OUTSIDE the checkout
# show up in the same browser. Relative paths are resolved against the working directory
# and then the project root, and a folder that does not exist is skipped -- so listing
# somewhere you do not have costs nothing. A video's workspace is named after its path
# under whichever of these roots contains it, so clips of the same name in different case
# folders never collide.
raw_videos_root: ./raw-videos
extra_video_roots:
  - ../data
image_endpoint: images
mask_endpoint: masks
vis_endpoint: vis

amp: True
weights: gui/weights/cutie-surgenetseg-50k.pth
ritm_weights: gui/weights/ritm-surgenetseg-50k.pth

# All "size" parameters represent the length of the shorter edge
# maximum internal processing size; reducing this speeds up processing
max_internal_size: 480

# maximum size for extracting frames; the output will also be in this size
# reducing this mainly speed up I/O
# it should not be smaller than the internal size
max_overall_size: 1080

# cut the black bars off the picture when extracting a video / copying in images.
# Endoscope recordings are letterboxed and the padding is not picture: it wastes network
# resolution, skews max_overall_size (which scales to the SHORT edge, partly padding),
# and stops an instrument running off the side from touching the image border -- which is
# the anchor the robot-arm scale reference pins its centerline to. Detected once from
# sampled frames and recorded in <workspace>/source_crop.json. See gui/border_crop.py.
crop_borders: True
buffer_size: 20

# we use multithreading for saving the results
save_queue_size: 20
num_save_threads: 4

# for reading
num_read_workers: 4

# for exporting video
output_fps: 24
output_bitrate: 1 # in Mbps

use_long_term: True
mem_every: 5
top_k: 30
stagger_updates: 5
chunk_size: -1 # number of objects to process in parallel; -1 means unlimited

# only relevant when long_term is not enabled
max_mem_frames: 5

# only relevant when long_term is enabled
long_term:
  count_usage: True
  max_mem_frames: 10
  min_mem_frames: 5
  num_prototypes: 128
  max_num_tokens: 10000
  buffer_tokens: 2000

save_aux: False
flip_aug: False
